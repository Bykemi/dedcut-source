<style id="dc-intro-css">
/* Animation de lancement (v4.53) : le « D » de DedCut se fait couper. Montrée dès le premier instant (avant l'app),
   la fin, « passer » et « revoir » sont dans src/intro.ts. Dessin = logo officiel (branding/logo-dedcut.svg).
   Tout bouge avec transform / opacity sur des calques : la carte graphique l'anime seule, fluide même pendant le chargement. */
#dcIntro{--S:clamp(120px,24vmin,230px);position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#08070e;overflow:hidden;cursor:pointer;animation:dciOut .45s ease-in 1.75s forwards}
#dcIntro .dci-glow{position:absolute;inset:-20%;opacity:0;background:radial-gradient(38% 38% at 50% 46%,rgba(124,58,237,.38),transparent 70%),radial-gradient(28% 28% at 57% 55%,rgba(34,211,238,.2),transparent 70%);animation:dciIn 1.1s ease-out .1s forwards}
#dcIntro .dci-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vmin,26px)}
#dcIntro .dci-logo{position:relative;width:var(--S);height:var(--S);animation:dciPop .55s cubic-bezier(.2,1.35,.4,1) both}
#dcIntro .dci-l{position:absolute;inset:0;will-change:transform,opacity}
#dcIntro .dci-l svg{display:block;width:100%;height:100%;overflow:visible}
#dcIntro .dci-full{animation:dciHide 0s linear .7s forwards}
#dcIntro .dci-top,#dcIntro .dci-bot{opacity:0;animation:dciTop .75s cubic-bezier(.3,1.2,.4,1) .7s forwards}
#dcIntro .dci-bot{animation-name:dciBot}
#dcIntro .dci-flash{position:absolute;inset:0;border-radius:22.7%;background:#fff;opacity:0;animation:dciFlash .55s ease-out .7s forwards}
#dcIntro .dci-blade{position:absolute;left:50%;top:54.8%;width:121.5%;height:max(3px,1.8%);border-radius:9px;background:#fff;box-shadow:0 0 10px #fff,0 0 24px #22d3ee;
  transform:translate(-50%,-50%) rotate(-12.16deg) scaleX(0);transform-origin:100% 50%;animation:dciSlash .26s cubic-bezier(.7,0,.2,1) .44s forwards,dciHide .3s ease-out .74s forwards}
#dcIntro .dci-spark{position:absolute;left:calc(var(--x) * 100%);top:calc(var(--y) * 100%);width:var(--r);height:var(--r);margin:calc(var(--r) / -2) 0 0 calc(var(--r) / -2);border-radius:50%;
  background:#e0faff;box-shadow:0 0 8px #22d3ee;opacity:0;animation:dciSpark .75s cubic-bezier(.15,.7,.3,1) .72s forwards}
#dcIntro .dci-word{font:800 clamp(30px,5.4vmin,56px)/1 Bahnschrift,"Segoe UI",sans-serif;letter-spacing:.5px;color:#fff;opacity:0;transform:translateY(14px);animation:dciWord .5s cubic-bezier(.2,.8,.2,1) 1s forwards}
#dcIntro .dci-word b{font-weight:800;background:linear-gradient(90deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
#dcIntro.dci-skip{animation:dciOut .25s ease-in forwards}
@keyframes dciPop{from{opacity:0;transform:scale(.55) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes dciIn{to{opacity:1}}
@keyframes dciHide{to{opacity:0}}
@keyframes dciTop{0%{opacity:1;transform:translate(0,0)}40%,62%{opacity:1;transform:translate(-7.8%,-6.05%)}100%{opacity:1;transform:translate(-1.76%,-1.37%)}}
@keyframes dciBot{0%{opacity:1;transform:translate(0,0)}40%,62%{opacity:1;transform:translate(7.8%,6.05%)}100%{opacity:1;transform:translate(1.76%,1.37%)}}
@keyframes dciSlash{to{transform:translate(-50%,-50%) rotate(-12.16deg) scaleX(1)}}
@keyframes dciFlash{0%{opacity:0}18%{opacity:.42}100%{opacity:0}}
@keyframes dciSpark{0%{opacity:0;transform:translate(0,0) scale(.8)}10%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(calc(var(--S) * var(--dx)),calc(var(--S) * var(--dy))) scale(.35)}}
@keyframes dciWord{to{opacity:1;transform:none}}
@keyframes dciOut{to{opacity:0;transform:scale(1.05);visibility:hidden}}
@media (prefers-reduced-motion:reduce){#dcIntro{animation:dciOut .3s ease-in .9s forwards}#dcIntro *{animation-duration:0s!important;animation-delay:0s!important}}
</style>
</head>
